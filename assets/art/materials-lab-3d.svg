<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-label="Science materials still life with glass, metal, wood, fabric, a beaker and natural samples">
 <defs>
  <linearGradient id="table" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3e7d2"/><stop offset="1" stop-color="#c9ad84"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ffff" stop-opacity=".9"/><stop offset=".4" stop-color="#8acbd4" stop-opacity=".5"/><stop offset="1" stop-color="#e4f8f5" stop-opacity=".8"/></linearGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fbff"/><stop offset=".25" stop-color="#9babb6"/><stop offset=".5" stop-color="#f1f5f6"/><stop offset=".75" stop-color="#8596a1"/><stop offset="1" stop-color="#dce5e8"/></linearGradient>
