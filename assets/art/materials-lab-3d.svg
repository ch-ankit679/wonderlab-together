  <linearGradient id="wool" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8e8d1"/><stop offset="1" stop-color="#c6a17e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="15"/><feComponentTransfer><feFuncA type="linear" slope=".21"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 </defs>
