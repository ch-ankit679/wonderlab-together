  <path d="M681 120C644 136 639 173 654 205C670 237 663 280 681 322C704 347 755 347 778 322C796 280 789 237 805 205C820 173 815 136 778 120C753 104 706 104 681 120Z" fill="url(#carrier)" stroke="#9f5c3c" stroke-width="9"/>
  <path d="M703 143C685 173 704 193 719 216C735 240 716 277 716 301" fill="none" stroke="#fff0cf" stroke-width="14" stroke-linecap="round" opacity=".92"/>
  <path d="M756 143C774 173 755 193 740 216C724 240 743 277 743 301" fill="none" stroke="#f8d29b" stroke-width="10" stroke-linecap="round"/>
 </g>
 <path d="M70 111H930" stroke="#fff" stroke-width="3" opacity=".5" stroke-dasharray="6 12"/>
 <path d="M70 349H930" stroke="#fff" stroke-width="3" opacity=".5" stroke-dasharray="6 12"/>
</svg>
